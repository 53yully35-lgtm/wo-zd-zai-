<html lang="zh-CN">

    <style>
        /* 全局样式 & 色板 */

            --c13: #BBA1CB; --c14: #DCC7E1; --c15: #C5A4CC; --c16: #8076A3;

        .btn-secondary { background:var(--c1); }

        .warning { color:var(--c13); font-size:0.7rem; margin-top:8px; }

        /* 后台提醒浮层 */

        .multi-alarm-buttons { display:flex; gap:12px; margin-top:16px; }

        .multi-alarm-buttons .cancel-btn { background:var(--c10); color:var(--c9); }

        .toggle-switch { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
        .toggle-label { color:var(--c9); }
        .toggle-checkbox { width:48px; height:24px; background:var(--c10); border-radius:24px; position:relative; cursor:pointer; transition:0.2s; }
        .toggle-checkbox.active { background:var(--c4); }
        .toggle-checkbox::after { content:''; width:20px; height:20px; background:white; border-radius:50%; position:absolute; top:2px; left:2px; transition:0.2s; }
        .toggle-checkbox.active::after { left:26px; }
        .api-selector { margin-bottom:12px; }
        .api-selector select { width:100%; padding:10px; border-radius:28px; border:1px solid var(--c10); background:var(--card-bg); color:var(--text-dark); }
    </style>
</head>

        <div class="settings-group"><div class="settings-title">界面设置</div><div class="font-size-control"><span>文字大小</span><button id="fontSmall">A-</button><button id="fontMedium">A</button><button id="fontLarge">A+</button></div><div class="theme-control"><span>深色模式</span><button id="themeLight">浅色</button><button id="themeDark">深色</button><button id="themeAuto">跟随系统</button></div></div>
        <div class="settings-group"><div class="settings-title">屏蔽词管理</div><div class="warning">AI回复中包含以下词语时，该条消息会被隐藏</div><div class="block-words-control"><input type="text" id="newBlockWord" placeholder="输入屏蔽词" style="flex:1;"><button id="addBlockWord">添加</button></div><div id="blockWordList" class="block-word-list"></div></div>
        <div class="warning" style="text-align:center; padding:12px;">提示：桌面图标需手动将本网页添加到主屏幕，并截图头像设置为图标。</div>

    <div class="nav"><div class="nav-item active" data-panel="chat">对话</div><div class="nav-item" data-panel="alarms">闹钟</div><div class="nav-item" data-panel="profile">我的</div></div>
</div>
<script>

    const avatarCanvas = document.getElementById('avatarCanvas'), roleNameSpan = document.getElementById('roleName'), roleDescSpan = document.getElementById('roleDesc'), chatMessagesDiv = document.getElementById('chatMessages'), chatInput = document.getElementById('chatInput'), sendBtn = document.getElementById('sendBtn'), micBtn = document.getElementById('micBtn'), alarmListDiv = document.getElementById('alarmList'), quickAlarmBtn = document.getElementById('quickAlarmBtn'), roleListDiv = document.getElementById('roleList'), editRoleName = document.getElementById('editRoleName'), editRoleDesc = document.getElementById('editRoleDesc'), roleFileInput = document.getElementById('roleFileInput'), apiSelect = document.getElementById('apiSelect'), apiUrlInput = document.getElementById('apiUrlInput'), modelNameInput = document.getElementById('modelNameInput'), apiKeyInput = document.getElementById('apiKeyInput'), extractBtn = document.getElementById('extractBtn'), extractResult = document.getElementById('extractResult'), saveRoleBtn = document.getElementById('saveRoleBtn'), switchRoleBtn = document.getElementById('switchRoleBtn'), newRoleBtn = document.getElementById('newRoleBtn'), newBlockWordInput = document.getElementById('newBlockWord'), addBlockWordBtn = document.getElementById('addBlockWord'), blockWordListDiv = document.getElementById('blockWordList'), aiToggle = document.getElementById('aiToggle');

    apiSelect.addEventListener('change', () => { const val = apiSelect.value; if (val !== 'custom') { apiUrlInput.value = presets[val].url; modelNameInput.value = presets[val].model; } });

    async function initWithProgress() { updateProgress(10); await new Promise(r => setTimeout(r, 100)); try { const res = await fetch('https://worldtimeapi.org/api/ip'); const data = await res.json(); const netTime = new Date(data.utc_datetime); const localTime = new Date(); if (Math.abs(localTime - netTime) > 60000) { alert('系统时间与网络时间相差超过1分钟，请开启“自动设置日期与时间”后刷新页面。'); window.location.reload(); return; } } catch(e) { console.warn('时间检测失败，跳过'); } updateProgress(30); if ('Notification' in window) { if (Notification.permission === 'granted') notificationPermission = true; else if (Notification.permission !== 'denied') { const perm = await Notification.requestPermission(); notificationPermission = perm === 'granted'; } } updateProgress(50); if (!loadFromLocalStorage() || roles.length === 0) { const stoneId = Date.now(); const stoneRole = { id: stoneId, name: '石头', desc: '沉默可靠', avatarDataURL: null, alarms: [], nextAlarmId: 1, messages: [] }; roles = [stoneRole]; currentRoleId = stoneId; updateCurrentRoleUI(); stoneRole.avatarDataURL = generateAvatarForRole(stoneRole); updateCurrentRoleUI(); saveToLocalStorage(); } else { updateCurrentRoleUI(); } updateProgress(80); renderBlockWords(); updateAIToggleUI(); setInterval(checkAlarms, 10000); addChatMessage('初始化完成。我是《我在。》的AI助手，现在我是“石头”。你可以新建角色或和我聊天～', false); updateProgress(100); await new Promise(r => setTimeout(r, 300)); splash.style.opacity = '0'; setTimeout(() => { splash.style.display = 'none'; appDiv.classList.add('visible'); }, 800); }
    initWithProgress();
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m); }
</script>
